<!doctype html>
<html lang="es">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Geist:wght@400;600;700&display=swap"
			rel="stylesheet"
		/>
		<link
			href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
			rel="stylesheet"
		/>
		<script>
			// Runs before first paint so the light/dark class matches the saved preference --
			// avoids a flash of the wrong theme. Mirrors settingsStore.ts's storage key/shape;
			// duplicated here (not imported) because this is a static inline script, not a module.
			(function () {
				try {
					var raw = localStorage.getItem('lamula-process:settings');
					var mode = raw ? JSON.parse(raw).themeMode : 'dark';
					var isLight =
						mode === 'light' ||
						(mode === 'system' && matchMedia('(prefers-color-scheme: light)').matches);
					if (isLight) document.documentElement.classList.add('light');
				} catch (e) {
					/* localStorage unavailable or corrupt -- fall back to dark, the built-in default */
				}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
