# Config del proyecto Pages de la app web (SvelteKit, adapter-static -> build/).
#
# El sitio de docs (mkdocs -> site/) se despliega a un proyecto Pages
# DISTINTO ("lamula-process-docs") y no necesita su propio wrangler.toml:
# docs.yml pasa --project-name explícito al invocar wrangler directamente,
# igual que en lamula-webviewer.
#
# Setup una vez (docs/ci-cd.md § "Setup manual pendiente"):
#   wrangler pages project create lamula-process --production-branch main

name = "lamula-process"
pages_build_output_dir = "build"
compatibility_date = "2026-07-01"
